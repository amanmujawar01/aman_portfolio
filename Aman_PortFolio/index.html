
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Aman Hajilal Mujawar - Data Analyst Portfolio | Python, SQL, Power BI, Excel" />
  <title>Aman Mujawar | Data Analyst</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ================= LIGHT MODE ================= */
    :root {
      --bg: #eef3f9;
      --bg-secondary: #ffffff;
      --nav-bg: rgba(238, 243, 249, .84);
      --card: rgba(255, 255, 255, .84);
      --text: #142033;
      --muted: #5b687e;
      --line: rgba(20, 32, 51, .13);
      --primary: #5746d9;
      --primary-dark: #4232b3;
      --primary-soft: rgba(87, 70, 217, .13);
      --primary-border: rgba(87, 70, 217, .32);
      --cyan: #0b9d98;
      --cyan-soft: rgba(11, 157, 152, .14);
      --orange: #d4732a;
      --shadow: 0 20px 60px rgba(46, 65, 95, .13);
    }

    /* ================= DARK MODE ================= */
    body.dark {
      --bg: #0c1424;
      --bg-secondary: #131c2f;
      --nav-bg: rgba(12, 20, 36, .8);
      --card: rgba(20, 30, 49, .82);
      --text: #f5f7fb;
      --muted: #b0bacc;
      --line: rgba(255, 255, 255, .13);
      --primary: #8975ff;
      --primary-dark: #6853e7;
      --primary-soft: rgba(137, 117, 255, .17);
      --primary-border: rgba(137, 117, 255, .4);
      --cyan: #22d8ca;
      --cyan-soft: rgba(34, 216, 202, .13);
      --orange: #ffb36b;
      --shadow: 0 20px 70px rgba(0, 0, 0, .32);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Bigger base text size for the whole site */
    html {
      font-size: 18px;
      scroll-behavior: smooth;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
      transition: background .3s ease, color .3s ease;
    }

    #three-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .75;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }

    section {
      padding: 100px 0;
      position: relative;
      scroll-margin-top: 70px;
    }

    /* ================= NAVBAR ================= */
    .navbar {
      position: fixed;
      top: 0;
      z-index: 50;
      width: 100%;
      padding: 16px 0;
      background: var(--nav-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.06em;
    }

    .logo span { color: var(--cyan); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 500;
    }

    .nav-links a { transition: color .2s ease; }
    .nav-links a:hover { color: var(--primary); }

    .nav-actions { display: flex; gap: 10px; }

    .mode-button,
    .menu-button {
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 15px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: .25s ease;
    }

    .mode-button:hover,
    .menu-button:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .menu-button { display: none; }

    /* ================= HERO ================= */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 150px;
      padding-bottom: 80px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .8rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(3.4rem, 7vw, 6.4rem);
      line-height: .95;
      letter-spacing: -.05em;
    }

    h1 span { color: var(--primary); }

    .hero-subtitle {
      margin-top: 22px;
      font-size: 1.35rem;
      font-weight: 600;
    }

    .hero-subtitle em {
      font-style: normal;
      color: var(--cyan);
      padding: 0 6px;
    }

    .hero-description {
      color: var(--muted);
      max-width: 600px;
      margin: 18px 0 30px;
      font-size: 1.2rem;
      line-height: 1.75;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 24px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-size: 1.05rem;
      font-weight: 700;
      transition: .25s ease;
    }

    .button:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .button-primary {
      color: #fff;
      background: linear-gradient(110deg, var(--primary), var(--primary-dark));
      border: 0;
    }

    .button-secondary {
      background: var(--card);
      backdrop-filter: blur(10px);
    }

    /* Hero stats cards */
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-top: 30px;
      max-width: 640px;
    }

    .stat-card {
      padding: 22px 24px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      transition: .25s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
    }

    .stat-card strong {
      display: block;
      font-family: "Space Grotesk", sans-serif;
      font-size: 2.5rem;
      line-height: 1;
      letter-spacing: -.04em;
      color: var(--cyan);
      margin-bottom: 10px;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 1rem;
    }

    /* Profile image */
    .profile-box {
      width: min(420px, 90%);
      margin: auto;
      position: relative;
      animation: floating 5s ease-in-out infinite;
    }

    .profile-box::after {
      content: "";
      position: absolute;
      inset: -18px;
      border: 1px solid var(--primary);
      border-radius: 36px;
      transform: rotate(6deg);
      opacity: .5;
      z-index: -1;
    }

    .profile-box img,
    .profile-fallback {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center top;
      border-radius: 30px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .profile-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: linear-gradient(160deg, var(--primary) 0%, #0d1524 100%);
      color: #fff;
    }

    .profile-fallback span {
      font-family: "Space Grotesk", sans-serif;
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: -.05em;
    }

    .profile-fallback p {
      margin-top: 10px;
      font-size: 1rem;
      color: rgba(255, 255, 255, .8);
      line-height: 1.5;
    }

    .profile-fallback b { color: var(--cyan); }

    .profile-label {
      position: absolute;
      left: -28px;
      bottom: 26px;
      padding: 15px 18px;
      border-radius: 16px;
      background: var(--card);
      backdrop-filter: blur(15px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 1rem;
    }

    .profile-label strong {
      display: block;
      color: var(--cyan);
      font-size: 1.3rem;
      font-family: "Space Grotesk", sans-serif;
    }

    @keyframes floating {
      0%, 100% { transform: translateY(0) rotateY(-3deg); }
      50% { transform: translateY(-14px) rotateY(3deg); }
    }

    /* ================= SECTION HEADINGS ================= */
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 25px;
      margin-bottom: 42px;
    }

    .section-heading h2 {
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      letter-spacing: -.05em;
      line-height: 1.05;
    }

    .section-heading h2 span { color: var(--cyan); }

    .section-heading p {
      color: var(--muted);
      max-width: 480px;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(17px);
      -webkit-backdrop-filter: blur(17px);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    /* ================= ABOUT ================= */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .about-card { padding: 32px; }

    .about-card p {
      color: var(--muted);
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .about-list {
      display: grid;
      gap: 16px;
      list-style: none;
    }

    .about-list li {
      color: var(--muted);
      display: flex;
      gap: 16px;
      font-size: 1.08rem;
    }

    .about-list b {
      color: var(--text);
      min-width: 120px;
    }

    .capabilities {
      margin-top: 24px;
      padding: 26px 32px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .capabilities h3 {
      font-size: 1.15rem;
      margin-right: 10px;
    }

    .capability {
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--primary-border);
      background: var(--primary-soft);
      font-weight: 600;
      font-size: .98rem;
    }

    /* ================= SKILLS ================= */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .skill {
      padding: 28px 18px;
      text-align: center;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      transition: .25s ease;
    }

    .skill:hover {
      transform: translateY(-7px);
      border-color: var(--primary);
    }

    .skill-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .skill h3 {
      font-size: 1.15rem;
      margin-bottom: 7px;
    }

    .skill p {
      color: var(--muted);
      font-size: .95rem;
    }

    /* ================= PROJECTS ================= */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .project-card {
      min-height: 310px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: .3s ease;
    }

    .project-card:hover {
      transform: translateY(-8px) rotateX(2deg);
      border-color: var(--cyan);
    }

    .project-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .project-number {
      color: var(--cyan);
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .08em;
    }

    .featured-pill {
      font-size: .8rem;
      font-weight: 700;
      color: var(--orange);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 11px;
    }

    .project-card h3 {
      font-size: 1.6rem;
      margin: 16px 0 10px;
      letter-spacing: -.03em;
      line-height: 1.2;
    }

    .project-card p {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tag {
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--text);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      font-size: .85rem;
    }

    .project-link {
      display: inline-block;
      margin-top: 24px;
      color: var(--cyan);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .project-link:hover { color: var(--primary); }

    .loading,
    .notice {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
    }

    .loading { padding: 36px; }

    /* ================= EDUCATION ================= */
    .education { padding: 16px 30px; }

    .education-row {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 26px 0;
      border-bottom: 1px solid var(--line);
    }

    .education-row:last-child { border-bottom: 0; }

    .education-year {
      color: var(--cyan);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .education-row h3 {
      font-size: 1.3rem;
      letter-spacing: -.02em;
    }

    .education-row p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 1rem;
    }

    .marks {
      color: var(--orange);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ================= RESUME + GITHUB (close together) ================= */
    .resume-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding: 44px;
      border-radius: 26px;
      background: linear-gradient(110deg, var(--primary-soft), var(--cyan-soft));
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .resume-box h2,
    .github-card h2 {
      font-size: 2.3rem;
      letter-spacing: -.04em;
      line-height: 1.1;
    }

    .resume-box p {
      color: var(--muted);
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .github-card {
      margin-top: 24px;
      padding: 44px 30px;
      text-align: center;
      scroll-margin-top: 100px;
    }

    .github-card p {
      color: var(--muted);
      max-width: 650px;
      margin: 14px auto 26px;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    /* ================= CONTACT ================= */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      font-size: 1.1rem;
      transition: .25s ease;
    }

    .contact-item:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .contact-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--primary-soft);
      font-size: 1.3rem;
    }

    .contact-item small {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: .9rem;
    }

    .contact-item a:hover { color: var(--cyan); }

    footer {
      padding: 32px 0;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 1rem;
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 900px) {
      .nav-links {
        display: none;
        position: absolute;
        top: 74px;
        left: 4%;
        right: 4%;
        padding: 22px;
        flex-direction: column;
        border-radius: 16px;
        background: var(--bg-secondary);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        font-size: 1.1rem;
      }

      .nav-links.show { display: flex; }
      .menu-button { display: block; }

      .hero-grid,
      .about-grid,
      .contact-grid { grid-template-columns: 1fr; }

      .hero { padding-top: 130px; }

      .profile-box {
        width: min(360px, 88%);
        margin-top: 20px;
      }

      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      .projects-grid { grid-template-columns: 1fr; }

      .section-heading { display: block; }
      .section-heading p { margin-top: 14px; }

      .education-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .resume-box {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 500px) {
      html { font-size: 16.5px; }
      section { padding: 75px 0; }
      h1 { font-size: 3.4rem; }
      .hero-subtitle { font-size: 1.15rem; }
      .profile-box { width: 84%; }
      .profile-label { left: -10px; }
      .resume-box,
      .github-card { padding: 30px 24px; }
      .about-card,
      .project-card { padding: 24px; }
      .education { padding: 10px 20px; }
    }
  </style>
</head>

<body class="dark">
  <div id="three-background"></div>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useState } = React;

    /* ===================== EASY SETTINGS ===================== */
    const CONFIG = {
      githubUsername: "amanmujawar01",
      githubProfile: "https://github.com/amanmujawar01?tab=repositories",
      profileImage: "profile.jpg",   // your photo (same folder as index.html)
      resumeFile: "resume.pdf",      // your resume (same folder as index.html)
      cgpa: "7.87"
    };

    // These projects always appear first
    const featuredRepositories = [
      "Marketing-Campaign-Performance-Analysis",
      "HR-Analytics-SQL-Project",
      "CRM-Sales-Analytics-SQL-Project",
      "Business_loan_and_NPA_Performance_dashboard"
    ];

    const projectDetails = {
      "Marketing-Campaign-Performance-Analysis": {
        description: "Marketing campaign performance analysis focused on campaign trends, customer response and overall marketing effectiveness.",
        tags: ["Python", "Pandas", "EDA", "Matplotlib"]
      },
      "HR-Analytics-SQL-Project": {
        description: "SQL-based HR analytics project exploring employee data and converting workforce data into useful business insights.",
        tags: ["SQL", "MySQL", "HR Analytics"]
      },
      "CRM-Sales-Analytics-SQL-Project": {
        description: "CRM sales analytics project using SQL to analyze sales activity, customer data and performance-related business questions.",
        tags: ["SQL", "CRM", "Sales Analytics"]
      },
      "Business_loan_and_NPA_Performance_dashboard": {
        description: "Interactive Power BI dashboard for monitoring business loan performance, portfolio trends and NPA-related metrics.",
        tags: ["Power BI", "Dashboard", "Banking Analytics"]
      }
    };

    const skillData = [
      ["🐍", "Python", "Programming and analytics"],
      ["🗃️", "SQL", "Queries and data analysis"],
      ["📊", "Power BI", "Interactive dashboards"],
      ["📗", "Excel", "Reporting and analysis"],
      ["🐼", "Pandas", "Data manipulation"],
      ["🔢", "NumPy", "Numerical computing"],
      ["📈", "Matplotlib", "Data visualization"],
      ["🛢️", "MySQL", "Database management"]
    ];

    const capabilities = [
      "Data Cleaning",
      "SQL Analysis",
      "Exploratory Data Analysis",
      "Dashboarding",
      "Business Insights"
    ];

    // Used only if GitHub cannot be reached
    const fallbackRepositories = featuredRepositories.map((name, i) => ({
      id: "fallback-" + i,
      name,
      html_url: `https://github.com/${CONFIG.githubUsername}/${name}`,
      language: null,
      topics: []
    }));

    /* ===================== 3D DATA ANALYTICS BACKGROUND ===================== */
    function ThreeDataBackground() {
      useEffect(() => {
        const container = document.getElementById("three-background");
        if (!container || !window.THREE) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(
          70, window.innerWidth / window.innerHeight, .1, 1000
        );
        camera.position.z = 8;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const purple = 0x7a68f0;
        const cyan = 0x1fc7bb;
        const orange = 0xe8984d;
        const colors = [purple, cyan, orange];

        // Floating data cubes
        const cubes = [];
        for (let i = 0; i < 16; i++) {
          const size = .18 + Math.random() * .4;
          const cube = new THREE.Mesh(
            new THREE.BoxGeometry(size, size, size),
            new THREE.MeshBasicMaterial({
              color: colors[i % 3], wireframe: true, transparent: true, opacity: .55
            })
          );
          cube.position.set(
            (Math.random() - .5) * 16,
            (Math.random() - .5) * 10,
            (Math.random() - .5) * 5
          );
          cube.userData.speed = .002 + Math.random() * .006;
          group.add(cube);
          cubes.push(cube);
        }

        // 3D bar chart
        for (let i = 0; i < 10; i++) {
          const height = .4 + Math.random() * 1.8;
          const bar = new THREE.Mesh(
            new THREE.BoxGeometry(.2, height, .2),
            new THREE.MeshBasicMaterial({
              color: i % 2 ? cyan : purple, transparent: true, opacity: .3
            })
          );
          bar.position.set(-6.5 + i * .45, -3 + height / 2, -1);
          group.add(bar);
        }

        // Line chart with data points
        const points = [];
        for (let i = 0; i < 20; i++) {
          points.push(new THREE.Vector3(-8 + i * .85, Math.sin(i * .65) * 1.2 + 1.8, -2));
        }
        group.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(points),
          new THREE.LineBasicMaterial({ color: cyan, transparent: true, opacity: .4 })
        ));

        const dots = [];
        points.forEach((point, i) => {
          const dot = new THREE.Mesh(
            new THREE.SphereGeometry(.06, 8, 8),
            new THREE.MeshBasicMaterial({ color: orange, transparent: true, opacity: .7 })
          );
          dot.position.copy(point);
          dot.userData.baseY = point.y;
          dot.userData.offset = i;
          group.add(dot);
          dots.push(dot);
        });

        // Donut chart ring
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(1.1, .32, 12, 40),
          new THREE.MeshBasicMaterial({
            color: purple, wireframe: true, transparent: true, opacity: .25
          })
        );
        ring.position.set(5.5, 2.2, -3);
        group.add(ring);

        // Data grid floor
        const grid = new THREE.GridHelper(40, 40, purple, cyan);
        grid.position.y = -4.5;
        grid.material.transparent = true;
        grid.material.opacity = .12;
        scene.add(grid);

        let mouseX = 0, mouseY = 0, frame = 0, rafId;

        function onMouseMove(event) {
          mouseX = (event.clientX / window.innerWidth - .5) * .5;
          mouseY = (event.clientY / window.innerHeight - .5) * .5;
        }

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
          rafId = requestAnimationFrame(animate);
          frame += .01;

          group.rotation.y += .0007;

          cubes.forEach(cube => {
            cube.rotation.x += cube.userData.speed;
            cube.rotation.y += cube.userData.speed * 1.4;
          });

          dots.forEach(dot => {
            dot.position.y = dot.userData.baseY + Math.sin(frame * 2 + dot.userData.offset) * .08;
          });

          ring.rotation.x += .004;
          ring.rotation.y += .003;

          camera.position.x += (mouseX - camera.position.x) * .02;
          camera.position.y += (-mouseY - camera.position.y) * .02;

          renderer.render(scene, camera);
        }

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("resize", onResize);
        animate();

        return () => {
          cancelAnimationFrame(rafId);
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("resize", onResize);
          renderer.dispose();
          container.innerHTML = "";
        };
      }, []);

      return null;
    }
